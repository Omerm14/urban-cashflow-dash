name: Auto-sync cron

# Triggers GET /api/cron/sync hourly. Not run via Vercel's own Cron Jobs
# feature — Vercel's Hobby plan caps cron frequency at once/day, too
# infrequent for auto-sync (see server/routes/cron.js's comment). This
# workflow calls the same endpoint externally instead, at no extra cost and
# with no third-party service.
#
# Requires a repository secret CRON_SECRET matching the server's
# CRON_SECRET env var (Settings -> Secrets and variables -> Actions).
#
# SCHEDULE RE-PAUSED 2026-08-05: a manual workflow_dispatch test after
# re-enabling the schedule (see git history) still hit a 504
# FUNCTION_INVOCATION_TIMEOUT with only 4 due integrations. Root cause:
# syncGmail (server/services/syncProcessor.js) has no per-run processing cap
# or sync_jobs-style chunking like syncGoogleDrive does — it processes every
# new message sequentially with no bound, so one Gmail integration with more
# than a handful of new messages can alone exceed Vercel's 60s limit. The
# concurrency cap added for the 2026-07-19 incident doesn't help here since
# it bounds how many integrations run in parallel, not how long any one
# integration's sync can take. Re-enable the `schedule:` trigger below only
# after Gmail sync gets a bounded per-run cap (matching Drive's pattern).

on:
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch: {} # allows a manual run from the Actions tab, for testing

jobs:
  trigger-sync:
    name: Trigger /api/cron/sync
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://gocashflow.co/api/cron/sync)
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::cron sync request failed with status $status"
            exit 1
          fi
