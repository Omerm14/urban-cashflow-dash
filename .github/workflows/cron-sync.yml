name: Auto-sync cron

# Triggers GET /api/cron/sync hourly. Not run via Vercel's own Cron Jobs
# feature — Vercel's Hobby plan caps cron frequency at once/day, too
# infrequent for auto-sync (see server/routes/cron.js's comment). This
# workflow calls the same endpoint externally instead, at no extra cost and
# with no third-party service.
#
# Requires a repository secret CRON_SECRET matching the server's
# CRON_SECRET env var (Settings -> Secrets and variables -> Actions).
#
# Schedule re-enabled 2026-08-05 after fixing the actual root cause of the
# repeated 504 FUNCTION_INVOCATION_TIMEOUTs: processFile() was re-uploading
# the full source file to storage once PER PAGE of a multi-page PDF (17x
# redundant uploads for a 17-page file), which alone could exceed Vercel's
# 60s limit and left a stuck sync_jobs row retrying the same file forever
# (server/services/syncProcessor.js — see PR #150). Along the way this also
# picked up: a per-integration concurrency cap in cron.js (#144), a signaled
# (not silent) block when a prior Drive sync_jobs run is still active (#146),
# and the same bounded-processing + sync_jobs chunking pattern extended to
# Gmail, which previously had no cap at all (#148). Verified via a manual
# workflow_dispatch run completing in ~13s (HTTP 200) after #150 merged,
# down from the ~60s+ timeouts seen before.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {} # allows a manual run from the Actions tab, for testing

jobs:
  trigger-sync:
    name: Trigger /api/cron/sync
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://gocashflow.co/api/cron/sync)
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::cron sync request failed with status $status"
            exit 1
          fi
