<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#0d1320"/>
    </linearGradient>

    <!-- Blue glow blob -->
    <radialGradient id="og-glow1" cx="50%" cy="50%" r="50%">
      <stop stop-color="#1d4ed8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow2" cx="50%" cy="50%" r="50%">
      <stop stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo gradients -->
    <linearGradient id="og-arc" x1="480" y1="120" x2="600" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="og-arrow" x1="580" y1="260" x2="660" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Grid mask -->
    <mask id="og-grid-mask">
      <radialGradient id="og-grid-fade" cx="50%" cy="50%" r="60%">
        <stop stop-color="white" stop-opacity="1"/>
        <stop offset="1" stop-color="white" stop-opacity="0"/>
      </radialGradient>
      <rect width="1200" height="630" fill="url(#og-grid-fade)"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Background glows -->
  <ellipse cx="300" cy="200" rx="500" ry="400" fill="url(#og-glow1)" opacity="0.6"/>
  <ellipse cx="900" cy="420" rx="400" ry="320" fill="url(#og-glow2)" opacity="0.5"/>

  <!-- Subtle grid overlay -->
  <rect width="1200" height="630" fill="none" mask="url(#og-grid-mask)" opacity="0.3">
    <pattern id="og-grid" x="0" y="0" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M 54 0 L 0 0 0 54" fill="none" stroke="rgba(59,130,246,0.15)" stroke-width="1"/>
    </pattern>
  </rect>
  <rect width="1200" height="630" fill="url(#og-grid)" opacity="0.15" mask="url(#og-grid-mask)"/>

  <!-- ===== LOGO MARK (centered, 160px equivalent at 40px viewBox → scale 4x) ===== -->
  <!-- C-arc -->
  <path
    d="M660 188C643 156 614 136 584 136C535 136 496 175 496 224C496 273 535 312 584 312C614 312 643 292 660 260"
    stroke="url(#og-arc)"
    stroke-width="18"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Document body -->
  <rect x="554" y="164" width="60" height="78" rx="8" fill="white"/>
  <!-- Document fold -->
  <path d="M600 164 L614 178 L600 178 Z" fill="#3b82f6" opacity="0.6"/>

  <!-- Document lines -->
  <line x1="566" y1="196" x2="600" y2="196" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="566" y1="208" x2="600" y2="208" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="566" y1="220" x2="586" y2="220" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- Cyan arrow -->
  <path d="M640 278C654 260 670 236 660 206" stroke="url(#og-arrow)" stroke-width="11" stroke-linecap="round" fill="none"/>
  <polyline points="633,196 660,206 672,184" stroke="url(#og-arrow)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ===== WORDMARK ===== -->
  <!-- "Cash" in white -->
  <text x="384" y="385" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">Cash</text>
  <!-- "flow" in cyan -->
  <text x="560" y="385" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="800" fill="#06b6d4" letter-spacing="-2">flow</text>

  <!-- ===== TAGLINE ===== -->
  <text x="600" y="440" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0">Stop Chasing Invoices. Start Managing Cash Flow.</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="400" y1="478" x2="800" y2="478" stroke="#1e2330" stroke-width="1"/>

  <!-- ===== INTEGRATION ICONS row ===== -->
  <!-- Gmail -->
  <g transform="translate(434, 500)">
    <rect width="40" height="40" rx="8" fill="#1e2330"/>
    <!-- Gmail M shape -->
    <text x="20" y="27" font-size="20" text-anchor="middle" font-family="sans-serif">✉</text>
  </g>
  <text x="454" y="552" font-family="Inter, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Gmail</text>

  <!-- WhatsApp -->
  <g transform="translate(534, 500)">
    <rect width="40" height="40" rx="8" fill="#1e2330"/>
    <text x="20" y="27" font-size="20" text-anchor="middle" font-family="sans-serif">💬</text>
  </g>
  <text x="554" y="552" font-family="Inter, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">WhatsApp</text>

  <!-- Google Drive -->
  <g transform="translate(634, 500)">
    <rect width="40" height="40" rx="8" fill="#1e2330"/>
    <text x="20" y="27" font-size="20" text-anchor="middle" font-family="sans-serif">📁</text>
  </g>
  <text x="654" y="552" font-family="Inter, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Drive</text>

  <!-- Green Invoice -->
  <g transform="translate(734, 500)">
    <rect width="40" height="40" rx="8" fill="#1e2330"/>
    <text x="20" y="27" font-size="20" text-anchor="middle" font-family="sans-serif">🧾</text>
  </g>
  <text x="754" y="552" font-family="Inter, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">חשבונית</text>

  <!-- Bottom branding pill -->
  <rect x="490" y="590" width="220" height="28" rx="14" fill="#13161e" stroke="#1e2330" stroke-width="1"/>
  <circle cx="508" cy="604" r="5" fill="#10b981"/>
  <text x="518" y="609" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">cashflow.app · For Israeli Businesses</text>
</svg>
