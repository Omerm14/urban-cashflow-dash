<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background (matches app --bg / Night Ledger) -->
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F0D"/>
      <stop offset="1" stop-color="#0A0F0D"/>
    </linearGradient>

    <!-- Accent glow blobs (matches .pg-blob) -->
    <radialGradient id="og-glow1" cx="50%" cy="50%" r="50%">
      <stop stop-color="#1FA97A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1FA97A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow2" cx="50%" cy="50%" r="50%">
      <stop stop-color="#8FE8C9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8FE8C9" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo mark gradient (matches .btn-primary / brand mark) -->
    <linearGradient id="og-mark" x1="496" y1="120" x2="660" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3DD6A3"/>
      <stop offset="1" stop-color="#1FA97A"/>
    </linearGradient>

    <!-- Wordmark accent gradient (matches h1 .accent) -->
    <linearGradient id="og-wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3DD6A3"/>
      <stop offset="1" stop-color="#8FE8C9"/>
    </linearGradient>

    <!-- Grid mask -->
    <mask id="og-grid-mask">
      <radialGradient id="og-grid-fade" cx="50%" cy="50%" r="60%">
        <stop stop-color="white" stop-opacity="1"/>
        <stop offset="1" stop-color="white" stop-opacity="0"/>
      </radialGradient>
      <rect width="1200" height="630" fill="url(#og-grid-fade)"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Background glows -->
  <ellipse cx="260" cy="160" rx="480" ry="380" fill="url(#og-glow1)" opacity="0.55"/>
  <ellipse cx="940" cy="460" rx="420" ry="340" fill="url(#og-glow2)" opacity="0.45"/>

  <!-- Subtle grid overlay -->
  <rect width="1200" height="630" fill="none" mask="url(#og-grid-mask)" opacity="0.35">
    <pattern id="og-grid" x="0" y="0" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M 54 0 L 0 0 0 54" fill="none" stroke="rgba(61,214,163,0.16)" stroke-width="1"/>
    </pattern>
  </rect>
  <rect width="1200" height="630" fill="url(#og-grid)" opacity="0.18" mask="url(#og-grid-mask)"/>

  <!-- ===== LOGO MARK ===== -->
  <g transform="translate(496,120)">
    <path d="M 82,50 A 50,50 0 1 0 82,124" stroke="url(#og-mark)" stroke-width="21" stroke-linecap="round" fill="none"/>
    <path d="M 72,77 A 18,18 0 1 0 72,97" stroke="url(#og-mark)" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.55"/>
  </g>

  <!-- ===== WORDMARK ===== -->
  <text x="616" y="248" font-family="'Schibsted Grotesk', 'Hanken Grotesk', -apple-system, sans-serif" font-size="72" font-weight="800" fill="#F2F1EA" letter-spacing="-2">Cash<tspan fill="url(#og-wordmark)">flow</tspan></text>

  <!-- ===== TAGLINE ===== -->
  <text x="600" y="303" font-family="'Hanken Grotesk', -apple-system, sans-serif" font-size="24" font-weight="500" fill="#A8B5AE" text-anchor="middle" letter-spacing="0">Stop Chasing Invoices. Start Managing Cash Flow.</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="400" y1="345" x2="800" y2="345" stroke="#22312B" stroke-width="1"/>

  <!-- ===== INTEGRATION ICONS row ===== -->
  <g transform="translate(434, 367)">
    <rect width="40" height="40" rx="10" fill="#17211E" stroke="#22312B"/>
    <text x="20" y="27" font-size="19" text-anchor="middle" font-family="sans-serif" fill="#000">✉️</text>
  </g>
  <text x="454" y="421" font-family="'Hanken Grotesk', sans-serif" font-size="12" fill="#6E7B74" text-anchor="middle">Gmail</text>

  <g transform="translate(534, 367)">
    <rect width="40" height="40" rx="10" fill="#17211E" stroke="#22312B"/>
    <text x="20" y="27" font-size="19" text-anchor="middle" font-family="sans-serif" fill="#000">💬</text>
  </g>
  <text x="554" y="421" font-family="'Hanken Grotesk', sans-serif" font-size="12" fill="#6E7B74" text-anchor="middle">WhatsApp</text>

  <g transform="translate(634, 367)">
    <rect width="40" height="40" rx="10" fill="#17211E" stroke="#22312B"/>
    <text x="20" y="27" font-size="19" text-anchor="middle" font-family="sans-serif" fill="#000">📁</text>
  </g>
  <text x="654" y="421" font-family="'Hanken Grotesk', sans-serif" font-size="12" fill="#6E7B74" text-anchor="middle">Drive</text>

  <g transform="translate(734, 367)">
    <rect width="40" height="40" rx="10" fill="#17211E" stroke="#22312B"/>
    <text x="20" y="27" font-size="19" text-anchor="middle" font-family="sans-serif" fill="#000">🧾</text>
  </g>
  <text x="754" y="421" font-family="'Hanken Grotesk', sans-serif" font-size="12" fill="#6E7B74" text-anchor="middle">חשבונית</text>

  <!-- Bottom branding pill -->
  <rect x="470" y="463" width="260" height="30" rx="15" fill="#111917" stroke="#22312B"/>
  <circle cx="490" cy="478" r="5" fill="#3BD68C"/>
  <text x="502" y="483" font-family="'Hanken Grotesk', sans-serif" font-size="13" font-weight="600" fill="#A8B5AE">gocashflow.co · For Israeli Businesses</text>
</svg>
