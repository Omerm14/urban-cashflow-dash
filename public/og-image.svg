<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F0D"/>
      <stop offset="1" stop-color="#0A0F0D"/>
    </linearGradient>

    <radialGradient id="og-glow1" cx="50%" cy="50%" r="50%">
      <stop stop-color="#1FA97A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1FA97A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow2" cx="50%" cy="50%" r="50%">
      <stop stop-color="#8FE8C9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8FE8C9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="og-mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3DD6A3"/>
      <stop offset="1" stop-color="#1FA97A"/>
    </linearGradient>

    <linearGradient id="og-accent-text" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3DD6A3"/>
      <stop offset="1" stop-color="#8FE8C9"/>
    </linearGradient>

    <linearGradient id="og-card" x1="620" y1="105" x2="1140" y2="525" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17211E"/>
      <stop offset="1" stop-color="#111917"/>
    </linearGradient>

    <mask id="og-grid-mask">
      <radialGradient id="og-grid-fade" cx="35%" cy="40%" r="55%">
        <stop stop-color="white" stop-opacity="1"/>
        <stop offset="1" stop-color="white" stop-opacity="0"/>
      </radialGradient>
      <rect width="1200" height="630" fill="url(#og-grid-fade)"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <ellipse cx="180" cy="120" rx="440" ry="360" fill="url(#og-glow1)" opacity="0.55"/>
  <ellipse cx="980" cy="520" rx="420" ry="340" fill="url(#og-glow2)" opacity="0.4"/>

  <rect width="1200" height="630" fill="none" mask="url(#og-grid-mask)" opacity="0.3">
    <pattern id="og-grid" x="0" y="0" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M 54 0 L 0 0 0 54" fill="none" stroke="rgba(61,214,163,0.16)" stroke-width="1"/>
    </pattern>
  </rect>
  <rect width="1200" height="630" fill="url(#og-grid)" opacity="0.16" mask="url(#og-grid-mask)"/>

  <!-- ===== LEFT: brand lockup ===== -->
  <g transform="translate(64,52)">
    <path d="M 38,8 A 30,30 0 1 0 38,52" stroke="url(#og-mark)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 32,22 A 11,11 0 1 0 32,38" stroke="url(#og-mark)" stroke-width="7.5" stroke-linecap="round" fill="none" opacity="0.55"/>
    <text x="70" y="42" font-family="'Schibsted Grotesk','Hanken Grotesk',-apple-system,sans-serif" font-size="30" font-weight="800" fill="#F2F1EA" letter-spacing="-1">Cashflow</text>
  </g>

  <!-- ===== HEADLINE ===== -->
  <text x="64" y="188" font-family="'Schibsted Grotesk','Hanken Grotesk',-apple-system,sans-serif" font-size="52" font-weight="900" fill="#F2F1EA" letter-spacing="-1.5">Stop Chasing</text>
  <text x="64" y="248" font-family="'Schibsted Grotesk','Hanken Grotesk',-apple-system,sans-serif" font-size="52" font-weight="900" fill="url(#og-accent-text)" letter-spacing="-1.5">Invoices.</text>

  <!-- ===== SUBHEAD ===== -->
  <text x="64" y="298" font-family="'Hanken Grotesk',-apple-system,sans-serif" font-size="20" font-weight="500" fill="#A8B5AE">Every invoice, auto-collected from Gmail, WhatsApp,</text>
  <text x="64" y="326" font-family="'Hanken Grotesk',-apple-system,sans-serif" font-size="20" font-weight="500" fill="#A8B5AE">Google Drive &amp; Green Invoice — read and organized by AI.</text>

  <!-- ===== STAT ROW ===== -->
  <g transform="translate(64,378)">
    <text x="0" y="46" font-family="'Schibsted Grotesk','Hanken Grotesk',sans-serif" font-size="46" font-weight="900" fill="url(#og-accent-text)" letter-spacing="-1.5">3.2h</text>
    <text x="0" y="74" font-family="'Hanken Grotesk',sans-serif" font-size="15" font-weight="600" fill="#F2F1EA">Saved per week</text>
    <text x="0" y="94" font-family="'Hanken Grotesk',sans-serif" font-size="12.5" fill="#6E7B74">avg. across active users</text>
  </g>
  <line x1="230" y1="378" x2="230" y2="470" stroke="#22312B" stroke-width="1"/>
  <g transform="translate(262,378)">
    <text x="0" y="46" font-family="'Schibsted Grotesk','Hanken Grotesk',sans-serif" font-size="46" font-weight="900" fill="url(#og-accent-text)" letter-spacing="-1.5">94%</text>
    <text x="0" y="74" font-family="'Hanken Grotesk',sans-serif" font-size="15" font-weight="600" fill="#F2F1EA">Fewer late payments</text>
    <text x="0" y="94" font-family="'Hanken Grotesk',sans-serif" font-size="12.5" fill="#6E7B74">vs. manual tracking</text>
  </g>

  <!-- ===== BOTTOM PILL ===== -->
  <g transform="translate(64,536)">
    <rect width="230" height="30" rx="15" fill="#111917" stroke="#22312B"/>
    <circle cx="20" cy="15" r="5" fill="#3BD68C"/>
    <text x="34" y="20" font-family="'Hanken Grotesk',sans-serif" font-size="13" font-weight="600" fill="#A8B5AE">gocashflow.co · Israel</text>
  </g>

  <!-- ===== RIGHT: mini dashboard mockup ===== -->
  <g transform="translate(620,105)">
    <rect width="520" height="410" rx="20" fill="url(#og-card)" stroke="#2E423B"/>

    <!-- Header -->
    <text x="26" y="42" font-family="'Hanken Grotesk',sans-serif" font-size="13" font-weight="700" fill="#A8B5AE">CASH FLOW OVERVIEW</text>
    <circle cx="452" cy="37" r="4" fill="#3BD68C"/>
    <text x="464" y="41" font-family="'Hanken Grotesk',sans-serif" font-size="11" font-weight="600" fill="#3BD68C">LIVE</text>

    <!-- KPI row -->
    <g transform="translate(26,62)">
      <rect width="222" height="72" rx="12" fill="#0A0F0D" stroke="#22312B"/>
      <text x="16" y="26" font-family="'Hanken Grotesk',sans-serif" font-size="11" fill="#6E7B74" letter-spacing="0.6">OUTSTANDING</text>
      <text x="16" y="54" font-family="'Schibsted Grotesk',sans-serif" font-size="24" font-weight="800" fill="#F2F1EA">₪12,480</text>
    </g>
    <g transform="translate(272,62)">
      <rect width="222" height="72" rx="12" fill="#0A0F0D" stroke="#22312B"/>
      <text x="16" y="26" font-family="'Hanken Grotesk',sans-serif" font-size="11" fill="#6E7B74" letter-spacing="0.6">OVERDUE</text>
      <text x="16" y="54" font-family="'Schibsted Grotesk',sans-serif" font-size="24" font-weight="800" fill="#E8604C">₪2,140</text>
    </g>

    <!-- Invoice list -->
    <g font-family="'Hanken Grotesk',sans-serif" font-size="14">
      <line x1="26" y1="164" x2="494" y2="164" stroke="#22312B"/>
      <rect x="26" y="176" width="5" height="18" rx="2.5" fill="#3DD6A3"/>
      <text x="42" y="190" fill="#A8B5AE">AWS Israel</text>
      <text x="494" y="190" fill="#F2F1EA" font-weight="700" text-anchor="end">₪2,140</text>

      <line x1="26" y1="212" x2="494" y2="212" stroke="#22312B"/>
      <rect x="26" y="224" width="5" height="18" rx="2.5" fill="#3987E5"/>
      <text x="42" y="238" fill="#A8B5AE">Office Depot</text>
      <text x="494" y="238" fill="#F2F1EA" font-weight="700" text-anchor="end">₪1,475</text>

      <line x1="26" y1="260" x2="494" y2="260" stroke="#22312B"/>
      <rect x="26" y="272" width="5" height="18" rx="2.5" fill="#E0A93D"/>
      <text x="42" y="286" fill="#A8B5AE">מוסך הצפון</text>
      <text x="494" y="286" fill="#F2F1EA" font-weight="700" text-anchor="end">₪980</text>

      <line x1="26" y1="308" x2="494" y2="308" stroke="#22312B"/>
      <rect x="26" y="320" width="5" height="18" rx="2.5" fill="#8FE8C9"/>
      <text x="42" y="334" fill="#A8B5AE">Wolt Business</text>
      <text x="494" y="334" fill="#F2F1EA" font-weight="700" text-anchor="end">₪640</text>
    </g>

    <!-- Source strip -->
    <g transform="translate(26,358)" font-family="'Hanken Grotesk',sans-serif" font-size="11.5" fill="#6E7B74">
      <circle cx="4" cy="0" r="3.5" fill="#3DD6A3"/><text x="12" y="4">Gmail</text>
      <circle cx="80" cy="0" r="3.5" fill="#3987E5"/><text x="88" y="4">Drive</text>
      <circle cx="150" cy="0" r="3.5" fill="#E0A93D"/><text x="158" y="4">WhatsApp</text>
      <circle cx="248" cy="0" r="3.5" fill="#8FE8C9"/><text x="256" y="4">Green Invoice</text>
    </g>
  </g>
</svg>
