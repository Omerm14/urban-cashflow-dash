    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Document -->
  <rect x="11" y="10" width="10" height="13" rx="2" fill="white"/>
  <line x1="13.5" y1="15" x2="18.5" y2="15" stroke="#3b82f6" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="13.5" y1="17.2" x2="18.5" y2="17.2" stroke="#3b82f6" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="13.5" y1="19.4" x2="16.5" y2="19.4" stroke="#3b82f6" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Upward arrow (cyan) -->
  <path d="M22.5 23C24 21 26 18.5 25 15" stroke="url(#fav-arrow)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <polyline points="22,12.5 25,15 27.5,12.5" stroke="url(#fav-arrow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
